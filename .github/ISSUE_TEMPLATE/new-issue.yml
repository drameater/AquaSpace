name: AquaSpace bug report
description: Report a problem with this fork
body:
  - type: markdown
    attributes:
      value: |
        Describe the AquaSpace problem and how to reproduce it. Remove private data from configuration or diagnostic excerpts before sharing them.
  - type: input
    id: version
    attributes:
      label: AquaSpace version and macOS version
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Reproduction and expected behavior
      description: Include the affected app, steps to reproduce, what happened, and what you expected.
    validations:
      required: true
