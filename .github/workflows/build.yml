name: AquaSpace offline checks

# Run from the Actions page only. Pushes, PRs and schedules consume no runner time.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquaspace-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-offline:
    name: Offline Python regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run offline regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s script/tests -v
